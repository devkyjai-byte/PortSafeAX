name: Validate MVP

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Create isolated environment
        run: |
          python -m venv .ci-venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$GITHUB_WORKSPACE/.ci-venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$GITHUB_WORKSPACE/.ci-venv/bin" >> "$GITHUB_PATH"
          fi
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Test rules and dashboard
        run: python -m pytest -q
      - name: Rebuild synthetic demo evidence
        run: |
          python -m scripts.verify_demo
          python -m scripts.build_allocation_demo
          python -m scripts.build_proximity_demo
      - name: Check committed evidence matches engine
        run: git diff --exit-code -- data/verification_metrics.json demo/PortSafeAX_allocation_demo.html demo/PortSafeAX_allocation_demo.json demo/PortSafeAX_proximity_demo.html demo/PortSafeAX_proximity_demo.json
      - name: Build and verify offline package
        run: |
          python -m scripts.package_demo
          python -m scripts.package_demo --verify deliverables/PortSafeAX_offline_demo.zip

  demo-download:
    name: Save verified demo download
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build offline demo and provenance receipt
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -m scripts.package_demo --receipt deliverables/build_receipt.json --commit "$BUILD_COMMIT" --run-url "$BUILD_RUN_URL"
          python -m scripts.package_demo --verify deliverables/PortSafeAX_offline_demo.zip
      - name: Save downloadable package
        id: demo
        uses: actions/upload-artifact@v7
        with:
          name: portsafe-demo-${{ github.sha }}
          path: |
            deliverables/PortSafeAX_offline_demo.zip
            deliverables/build_receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Show download instructions
        env:
          DEMO_URL: ${{ steps.demo.outputs.artifact-url }}
        run: |
          echo '## PortSafe AX offline demo' >> "$GITHUB_STEP_SUMMARY"
          echo "[Download demo artifact]($DEMO_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Extract the artifact, then extract PortSafeAX_offline_demo.zip and open index.html. Synthetic data; browser and field validation remain separate. Retained for 30 days.' >> "$GITHUB_STEP_SUMMARY"
